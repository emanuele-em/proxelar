[package]
name = "proxelar-proto"
version = "0.5.1"
edition = "2021"
rust-version.workspace = true
publish = false

[dependencies]
bytes = "1.9"
futures-core = "0.3"
futures-util = { version = "0.3", default-features = false, features = ["alloc"] }
http = "1.4"
httparse = "1.10"
proxyapi_models = { version = "0.5.1", path = "../proxyapi_models" }
tokio = { version = "1.52", features = ["io-util", "macros", "rt", "sync", "time"] }

[dev-dependencies]
futures-util = "0.3"
proptest = "1.10"
tokio = { version = "1.52", features = ["io-util", "macros", "rt", "sync", "time"] }
