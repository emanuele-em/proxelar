name: Release

on:
  push:
    tags: ["v*"]
  pull_request:
    paths: [".github/workflows/release.yml"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing release tag to publish (for example, v0.6.0)"
        required: true
        type: string

permissions:
  contents: read

env:
  CARGO_INCREMENTAL: 0
  CARGO_TERM_COLOR: always
  PROXELAR_RUST_VERSION: "1.97.1"
  RELEASE_TAG: ${{ inputs.tag || (github.event_name == 'pull_request' && format('pr-{0}', github.event.number)) || github.ref_name }}

jobs:
  build:
    name: Build (${{ matrix.target }})
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            runner: ubuntu-latest
            archive: tar.gz
            deb: true
          - target: aarch64-unknown-linux-gnu
            runner: ubuntu-24.04-arm
            archive: tar.gz
            deb: true
          - target: x86_64-apple-darwin
            runner: macos-latest
            archive: tar.gz
          - target: aarch64-apple-darwin
            runner: macos-latest
            archive: tar.gz
          - target: x86_64-pc-windows-msvc
            runner: windows-latest
            archive: zip
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.tag && format('refs/tags/{0}', inputs.tag) || github.sha }}

      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.PROXELAR_RUST_VERSION }}
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      - name: Install ARM64 build dependencies
        if: matrix.target == 'aarch64-unknown-linux-gnu'
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake clang libclang-dev perl

      - name: Build
        run: cargo build -p proxelar --release --locked --features http3 --target ${{ matrix.target }}

      - name: Package (unix)
        if: matrix.archive == 'tar.gz'
        run: |
          cd target/${{ matrix.target }}/release
          tar czf "../../../proxelar-${RELEASE_TAG}-${{ matrix.target }}.tar.gz" proxelar
          cd ../../..

      - name: Install cargo-deb
        if: matrix.deb
        run: cargo install cargo-deb --locked

      - name: Package (deb)
        if: matrix.deb
        # Reuse the binary produced above and keep it intact in the package.
        run: |
          cargo deb -p proxelar --target ${{ matrix.target }} --no-build --no-strip \
            --output "proxelar-${RELEASE_TAG}-${{ matrix.target }}.deb"

      - name: Package (windows)
        if: matrix.archive == 'zip'
        shell: pwsh
        run: |
          Compress-Archive -Path "target/${{ matrix.target }}/release/proxelar.exe" -DestinationPath "proxelar-${env:RELEASE_TAG}-${{ matrix.target }}.zip"

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: proxelar-${{ matrix.target }}
          path: proxelar-${{ env.RELEASE_TAG }}-${{ matrix.target }}.*

  release:
    name: Create release
    if: github.event_name != 'pull_request'
    needs: [build]
    runs-on: ubuntu-latest
    permissions:
      actions: read
      attestations: write
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.tag && format('refs/tags/{0}', inputs.tag) || github.sha }}
          fetch-depth: 0

      - name: Read release notes from changelog
        id: release-notes
        shell: bash
        run: |
          version="${RELEASE_TAG#v}"
          notes="$(
            awk -v heading="## [$version]" '
              index($0, heading) == 1 { in_release = 1; next }
              in_release && /^## \[/ { exit }
              in_release { print }
            ' CHANGELOG.md
          )"
          if [[ -z "${notes//[[:space:]]/}" ]]; then
            echo "No CHANGELOG.md section found for $RELEASE_TAG" >&2
            exit 1
          fi
          {
            echo "content<<RELEASE_NOTES"
            printf '%s\n' "$notes"
            echo "RELEASE_NOTES"
          } >> "$GITHUB_OUTPUT"

      - uses: actions/download-artifact@v8
        with:
          path: artifacts
          merge-multiple: true

      - name: Generate SPDX SBOM
        uses: anchore/sbom-action@v0
        with:
          path: .
          format: spdx-json
          output-file: artifacts/proxelar-${{ env.RELEASE_TAG }}.spdx.json
          upload-artifact: false
          upload-release-assets: false

      - name: Generate SHA-256 checksums
        working-directory: artifacts
        run: sha256sum -- * > SHA256SUMS

      - name: Attest release artifacts
        uses: actions/attest@v4.2.2
        with:
          subject-path: artifacts/*

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          body: ${{ steps.release-notes.outputs.content }}
          files: artifacts/*
          prerelease: ${{ contains(inputs.tag || github.ref_name, '-') }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  publish:
    name: Publish to crates.io
    needs: release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.tag && format('refs/tags/{0}', inputs.tag) || github.sha }}

      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.PROXELAR_RUST_VERSION }}

      - name: Publish proxyapi_models
        run: cargo publish -p proxyapi_models --token ${{ secrets.CARGO_REGISTRY_TOKEN }}

      - name: Wait for crates.io index
        run: sleep 30

      - name: Publish proxelar-proto
        run: cargo publish -p proxelar-proto --token ${{ secrets.CARGO_REGISTRY_TOKEN }}

      - name: Wait for crates.io index
        run: sleep 30

      - name: Publish proxyapi
        run: cargo publish -p proxyapi --token ${{ secrets.CARGO_REGISTRY_TOKEN }}

      - name: Wait for crates.io index
        run: sleep 30

      - name: Publish proxelar
        run: cargo publish -p proxelar --token ${{ secrets.CARGO_REGISTRY_TOKEN }}

  homebrew:
    name: Bump Homebrew formula
    needs: release
    runs-on: ubuntu-latest
    if: "!contains(inputs.tag || github.ref_name, '-')"
    steps:
      - uses: mislav/bump-homebrew-formula-action@v4.2
        with:
          tag-name: ${{ env.RELEASE_TAG }}
          formula-name: proxelar
          homebrew-tap: Homebrew/homebrew-core
          download-url: https://github.com/emanuele-em/proxelar/archive/refs/tags/${{ env.RELEASE_TAG }}.tar.gz
          create-pullrequest: true
        env:
          COMMITTER_TOKEN: ${{ secrets.HOMEBREW_CORE_TOKEN }}

  container:
    name: Publish container image
    needs: release
    runs-on: ubuntu-latest
    permissions:
      attestations: write
      contents: read
      id-token: write
      packages: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.tag && format('refs/tags/{0}', inputs.tag) || github.sha }}

      - uses: docker/setup-buildx-action@v4

      - name: Log in to ghcr.io
        uses: docker/login-action@v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Collect image metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=semver,pattern={{version}},value=${{ env.RELEASE_TAG }}
            type=semver,pattern={{major}}.{{minor}},value=${{ env.RELEASE_TAG }}
            type=raw,value=latest,enable=${{ !contains(inputs.tag || github.ref_name, '-') }}

      # linux/amd64 only for now: the Dockerfile compiles the workspace from
      # source, and building vendored OpenSSL and Lua for arm64 under QEMU
      # emulation risks exceeding the job timeout on every release.
      - name: Build and push
        id: build
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Attest image provenance
        uses: actions/attest-build-provenance@v4
        with:
          subject-name: ghcr.io/${{ github.repository }}
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true
