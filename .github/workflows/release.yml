name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

env:
  CARGO_INCREMENTAL: 0
  CARGO_TERM_COLOR: always
  PROXELAR_RUST_VERSION: "1.97.1"

jobs:
  build:
    name: Build (${{ matrix.target }})
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            runner: ubuntu-latest
            cross: false
            archive: tar.gz
            deb: true
          - target: aarch64-unknown-linux-gnu
            runner: ubuntu-latest
            cross: true
            archive: tar.gz
            deb: true
          - target: x86_64-apple-darwin
            runner: macos-latest
            cross: false
            archive: tar.gz
          - target: aarch64-apple-darwin
            runner: macos-latest
            cross: false
            archive: tar.gz
          - target: x86_64-pc-windows-msvc
            runner: windows-latest
            cross: false
            archive: zip
    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.PROXELAR_RUST_VERSION }}
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      - name: Install cross
        if: matrix.cross
        run: cargo install cross --locked

      - name: Build (cross)
        if: matrix.cross
        run: cross build --release --locked --target ${{ matrix.target }}

      - name: Build (native)
        if: "!matrix.cross"
        run: cargo build --release --locked --target ${{ matrix.target }}

      - name: Package (unix)
        if: matrix.archive == 'tar.gz'
        run: |
          cd target/${{ matrix.target }}/release
          tar czf ../../../proxelar-${{ github.ref_name }}-${{ matrix.target }}.tar.gz proxelar
          cd ../../..

      - name: Install cargo-deb
        if: matrix.deb
        run: cargo install cargo-deb --locked

      - name: Package (deb)
        if: matrix.deb
        # --no-build reuses the binary produced above. --no-strip because the
        # runner's strip cannot process the cross-built aarch64 ELF.
        run: |
          cargo deb -p proxelar --target ${{ matrix.target }} --no-build --no-strip \
            --output proxelar-${{ github.ref_name }}-${{ matrix.target }}.deb

      - name: Package (windows)
        if: matrix.archive == 'zip'
        shell: pwsh
        run: |
          Compress-Archive -Path "target/${{ matrix.target }}/release/proxelar.exe" -DestinationPath "proxelar-${{ github.ref_name }}-${{ matrix.target }}.zip"

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: proxelar-${{ matrix.target }}
          path: proxelar-${{ github.ref_name }}-${{ matrix.target }}.*

  release:
    name: Create release
    needs: [build]
    runs-on: ubuntu-latest
    permissions:
      actions: read
      attestations: write
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Read release notes from changelog
        id: release-notes
        shell: bash
        run: |
          version="${GITHUB_REF_NAME#v}"
          notes="$(
            awk -v heading="## [$version]" '
              index($0, heading) == 1 { in_release = 1; next }
              in_release && /^## \[/ { exit }
              in_release { print }
            ' CHANGELOG.md
          )"
          if [[ -z "${notes//[[:space:]]/}" ]]; then
            echo "No CHANGELOG.md section found for $GITHUB_REF_NAME" >&2
            exit 1
          fi
          {
            echo "content<<RELEASE_NOTES"
            printf '%s\n' "$notes"
            echo "RELEASE_NOTES"
          } >> "$GITHUB_OUTPUT"

      - uses: actions/download-artifact@v8
        with:
          path: artifacts
          merge-multiple: true

      - name: Generate SPDX SBOM
        uses: anchore/sbom-action@v0
        with:
          path: .
          format: spdx-json
          output-file: artifacts/proxelar-${{ github.ref_name }}.spdx.json
          upload-artifact: false
          upload-release-assets: false

      - name: Generate SHA-256 checksums
        working-directory: artifacts
        run: sha256sum * > SHA256SUMS

      - name: Attest release artifacts
        uses: actions/attest@v4.2.2
        with:
          subject-path: artifacts/*

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          body: ${{ steps.release-notes.outputs.content }}
          files: artifacts/*
          prerelease: ${{ contains(github.ref_name, '-') }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  publish:
    name: Publish to crates.io
    needs: release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.PROXELAR_RUST_VERSION }}

      - name: Publish proxyapi_models
        run: cargo publish -p proxyapi_models --token ${{ secrets.CARGO_REGISTRY_TOKEN }}

      - name: Wait for crates.io index
        run: sleep 30

      - name: Publish proxyapi
        run: cargo publish -p proxyapi --token ${{ secrets.CARGO_REGISTRY_TOKEN }}

      - name: Wait for crates.io index
        run: sleep 30

      - name: Publish proxelar
        run: cargo publish -p proxelar --token ${{ secrets.CARGO_REGISTRY_TOKEN }}

  homebrew:
    name: Bump Homebrew formula
    needs: release
    runs-on: ubuntu-latest
    if: "!contains(github.ref_name, '-')"
    steps:
      - uses: mislav/bump-homebrew-formula-action@v4.2
        with:
          formula-name: proxelar
          homebrew-tap: Homebrew/homebrew-core
          download-url: https://github.com/emanuele-em/proxelar/archive/refs/tags/${{ github.ref_name }}.tar.gz
          create-pullrequest: true
        env:
          COMMITTER_TOKEN: ${{ secrets.HOMEBREW_CORE_TOKEN }}

  container:
    name: Publish container image
    needs: release
    runs-on: ubuntu-latest
    permissions:
      attestations: write
      contents: read
      id-token: write
      packages: write
    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-buildx-action@v4

      - name: Log in to ghcr.io
        uses: docker/login-action@v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Collect image metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable=${{ !contains(github.ref_name, '-') }}

      # linux/amd64 only for now: the Dockerfile compiles the workspace from
      # source, and building vendored OpenSSL and Lua for arm64 under QEMU
      # emulation risks exceeding the job timeout on every release.
      - name: Build and push
        id: build
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Attest image provenance
        uses: actions/attest-build-provenance@v4
        with:
          subject-name: ghcr.io/${{ github.repository }}
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true
