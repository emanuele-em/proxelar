[package]
name = "proxelar"
version = "0.5.1"
edition = "2021"
rust-version.workspace = true
authors = ["Emanuele Micheletti <micheletti.emanuele@hotmail.com>"]
description = "MITM proxy for HTTP/HTTPS traffic"
license = "MIT"
repository = "https://github.com/emanuele-em/proxelar"
homepage = "https://proxelar.micheletti.io"
documentation = "https://proxelar.micheletti.io"
readme = "../README.md"
categories = ["command-line-utilities", "development-tools", "network-programming"]
keywords = ["proxy", "mitm", "http", "https", "lua"]

[package.metadata.deb]
maintainer = "Emanuele Micheletti <micheletti.emanuele@hotmail.com>"
copyright = "2026, Emanuele Micheletti <micheletti.emanuele@hotmail.com>"
license-file = ["../LICENSE-MIT", "0"]
section = "net"
priority = "optional"
# BoringSSL and Lua are vendored, so only the C runtime is resolved dynamically.
# Set explicitly rather than via `$auto`, which cannot run dpkg-shlibdeps when
# the aarch64 binary is cross-built on an amd64 runner.
depends = "libc6, libgcc-s1"
extended-description = """
Proxelar is a single-binary MITM proxy for inspecting, intercepting, replaying
and rewriting HTTP, HTTPS and WebSocket traffic. It runs as an interactive TUI,
plain terminal output, a web GUI, or a headless REST API, and supports forward,
reverse, WireGuard, SOCKS5, DNS and fixed-target UDP capture modes, Lua hooks,
declarative rules, HTTP/3 reverse and WireGuard interception, and HAR/curl/raw
export with secret redaction."""
assets = [
    ["target/release/proxelar", "usr/bin/", "755"],
    ["../README.md", "usr/share/doc/proxelar/README.md", "644"],
    ["../CHANGELOG.md", "usr/share/doc/proxelar/CHANGELOG.md", "644"],
]

[features]
default = ["scripting", "vendored-lua", "http3"]
scripting = ["proxyapi/scripting"]
vendored-lua = ["proxyapi/vendored-lua"]
http3 = ["proxyapi/http3"]

[dependencies]
proxyapi = { version = "0.5.1", path = "../proxyapi" }
bytes = "1.9"
http = "1.4"
proxyapi_models = { version = "0.5.1", path = "../proxyapi_models" }
clap = { version = "4.6", features = ["derive"] }
dirs = "6"
tokio = { version = "1.52", features = ["rt-multi-thread", "macros", "sync", "signal", "time", "net"] }
tokio-util = "0.7"
chrono = "0.4"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
rustls = { version = "0.23", default-features = false, features = ["ring"] }
open = "5"

# TUI
ratatui = "0.30"
crossterm = { version = "0.29", features = ["event-stream"] }
futures = "0.3"

# Web GUI
axum = { version = "0.8", features = ["ws"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
rand = "0.10"
qrcode = { version = "0.14", default-features = false }
