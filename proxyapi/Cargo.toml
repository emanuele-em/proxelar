[package]
name = "proxyapi"
version = "0.5.1"
edition = "2021"
rust-version.workspace = true
authors = ["Emanuele Micheletti <micheletti.emanuele@hotmail.com>"]
description = "Core library for the Proxelar MITM proxy"
license = "MIT"
repository = "https://github.com/emanuele-em/proxelar"
homepage = "https://proxelar.micheletti.io"
documentation = "https://docs.rs/proxyapi"
readme = "../README.md"
categories = ["development-tools", "network-programming", "web-programming::http-server"]
keywords = ["proxy", "mitm", "http", "https", "lua"]

[features]
default = []
scripting = ["dep:mlua", "dep:semver", "dep:sha2"]
# Statically link a vendored Lua 5.4.
vendored-lua = ["mlua?/vendored"]

[dependencies]
mlua = { version = "0.12", features = ["lua54", "send"], optional = true }
semver = { version = "1", features = ["serde"], optional = true }
sha2 = { version = "0.11", optional = true }
# Body (de)compression for the Lua scripting hooks (gzip/deflate + brotli).
flate2 = "1.1"
brotli = "8"
zstd = "0.13"
encoding_rs = "0.8"
# Networking/HTTP/TLS foundation: HTTP/1+2 client+server, BoringSSL TLS + MITM
# dynamic cert issuance, WebSocket relay, SOCKS5 server, and upstream proxy
# chaining all come from rama. Replaces hyper(-util,-rustls)/http(-body-util)/
# tokio-rustls/rustls/webpki-roots/openssl/moka/tower/tokio-tungstenite.
rama = { workspace = true, features = ["http-full", "boring", "socks5", "proxy"] }
tokio = { version = "1.52", features = ["rt", "net", "io-util", "macros", "sync", "time", "fs"] }
tokio-util = { version = "0.7", features = ["rt"] }
bstr = "1.11"
chrono = "0.4"
thiserror = "2.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
rmp-serde = "1.3"
base64 = "0.23"
boringtun = { version = "0.7.1", default-features = false }
netstack-smoltcp = "0.2.4"
proxyapi_models = { version = "0.5.1", path = "../proxyapi_models" }

[dev-dependencies]
tokio = { version = "1.52", features = ["full"] }
tempfile = "3"
