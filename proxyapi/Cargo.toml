[package]
name = "proxyapi"
version = "0.5.1"
edition = "2021"
rust-version.workspace = true
authors = ["Emanuele Micheletti <micheletti.emanuele@hotmail.com>"]
description = "Core library for the Proxelar MITM proxy"
license = "MIT"
repository = "https://github.com/emanuele-em/proxelar"
homepage = "https://proxelar.micheletti.io"
documentation = "https://docs.rs/proxyapi"
readme = "../README.md"
categories = ["development-tools", "network-programming", "web-programming::http-server"]
keywords = ["proxy", "mitm", "http", "https", "lua"]

[features]
default = []
scripting = ["dep:mlua", "dep:semver", "dep:sha2"]
http3 = ["dep:boring", "dep:quiche", "moka/sync"]
# Statically link a vendored Lua 5.4.
vendored-lua = ["mlua?/vendored"]

[dependencies]
mlua = { version = "0.12", features = ["lua54", "send"], optional = true }
semver = { version = "1", features = ["serde"], optional = true }
sha2 = { version = "0.11", optional = true }
# Body (de)compression for the Lua scripting hooks (gzip/deflate + brotli).
flate2 = "1.1"
brotli = "8"
zstd = "0.13"
encoding_rs = "0.8"
http = "1.4"
bytes = "1.9"
tokio-rustls = "0.26"
rustls = { version = "0.23", default-features = false, features = ["ring", "logging", "std", "tls12"] }
rustls-pki-types = "1.14"
webpki-roots = "1.0"
rcgen = { version = "0.14.9", default-features = false, features = ["pem", "ring", "x509-parser"] }
getrandom = "0.3"
time = "0.3"
moka = { version = "0.12", features = ["future"] }
tokio = { version = "1.52", features = ["rt", "net", "io-util", "macros", "sync", "time", "fs"] }
tokio-util = { version = "0.7", features = ["rt"] }
async-trait = "0.1"
bstr = "1.11"
chrono = "0.4"
thiserror = "2.0"
tracing = "0.1"
tower-service = "0.3"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
rmp-serde = "1.3"
base64 = "0.23"
tokio-tungstenite = { version = "0.30", default-features = false }
futures-util = { version = "0.3", default-features = false, features = ["sink"] }
boringtun = { version = "0.7.1", default-features = false }
netstack-smoltcp = "0.2.4"
proxyapi_models = { version = "0.5.1", path = "../proxyapi_models" }
proxelar-proto = { version = "0.5.1", path = "../proxelar-proto" }
quiche = { version = "0.29.3", optional = true }
boring = { version = "4.22", optional = true }

[dev-dependencies]
tokio = { version = "1.52", features = ["full", "test-util"] }
hyper = { version = "1.10", features = ["http1", "http2", "server", "client"] }
hyper-util = { version = "0.1", features = ["tokio", "http1", "http2"] }
http-body-util = "0.1"
reqwest = { version = "0.13", features = ["rustls"] }
rustls = { version = "0.23", features = ["ring"] }
tempfile = "3"
stats_alloc = "0.1"
x509-parser = "0.18"

[[bench]]
name = "protocol_baseline"
harness = false

[[bench]]
name = "protocol_final"
harness = false
