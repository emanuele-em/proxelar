[package]
name = "proxyapi_models"
version = "0.5.1"
edition = "2021"
rust-version.workspace = true
authors = ["Emanuele Micheletti <micheletti.emanuele@hotmail.com>"]
description = "Data models for the Proxelar MITM proxy"
license = "MIT"
repository = "https://github.com/emanuele-em/proxelar"
homepage = "https://proxelar.micheletti.io"
documentation = "https://docs.rs/proxyapi_models"
readme = "../README.md"
categories = ["data-structures", "network-programming", "web-programming::http-server"]
keywords = ["proxy", "http", "models", "serde", "traffic"]

[dependencies]
serde = { version = "1.0", features = ["derive"] }
# HTTP data types (Method/Uri/Version/HeaderMap/StatusCode) come from rama, which
# carries native serde for most of them; the handful without it use the local
# `http_serde` shim module. Keeps this crate free of the `http` hyperium crate.
rama = { workspace = true, features = ["http", "net"] }

[dev-dependencies]
serde_json = "1.0"
